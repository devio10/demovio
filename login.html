<!DOCTYPE html>
<html>
    <head>
        <title>Войти в Demovio</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles/master.css">
        <link rel="stylesheet" href="styles/auth.css">
        <link rel="stylesheet" href="styles/master-phones.css">
        <link rel="stylesheet" href="styles/auth-phones.css">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <header>
            <div class="header-side">
                <button onclick="window.open('landing.html', '_self')" class="header-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M216.49,111.51l-80-80a12,12,0,0,0-17,0l-80,80A12,12,0,0,0,36,120v96a4,4,0,0,0,4,4h64a4,4,0,0,0,4-4V156h40v60a4,4,0,0,0,4,4h64a4,4,0,0,0,4-4V120A12,12,0,0,0,216.49,111.51ZM212,212H156V152a4,4,0,0,0-4-4H104a4,4,0,0,0-4,4v60H44V120a4,4,0,0,1,1.17-2.83l80-80a4,4,0,0,1,5.66,0l80,80A4,4,0,0,1,212,120Z"></path></svg>
                </button>
            </div>
            <div>
                <span class="page_logo">DEMOVIO</span>
            </div>
            
            <div class="header-side">

            </div>
        </header>

        <div class="page-backgrounds">
            <img src="posters/home.jpeg" id="bg-credentials">
        </div>

        <div class="screen screen-credentials">
            <h1>Войдите в аккаунт</h1>
            <p class="text-description">Вы получите доступ к услугам Demovio, вашему паспорту, карте целого мира и статистике сервера.</p>
            
            <div class="fields">
                <input type="text" name="name" class="input-name" placeholder="Имя Игрока">
                <input type="password" name="password" class="input-password" placeholder="Пароль">
                <button onclick="login()" class="submit">Войти в Аккаунт</button>
            </div>
            <a href="signup.html" class="alternate-option">Создать новый аккаунт</a>
        </div>

        <div class="popup hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#4ade80" viewBox="0 0 256 256"><path d="M246.15,65.46l-.07-.08L222.15,41.85a20,20,0,0,0-28.23-.05l-90,88.83L70.06,97.78a20,20,0,0,0-28.21.08l-24,24a20,20,0,0,0,0,28.26l71.62,72a20,20,0,0,0,28.29,0L246.15,93.74A20,20,0,0,0,246.15,65.46ZM103.61,202.33,37.64,136,56,117.61,95.65,156a12,12,0,0,0,16.78-.08L208,61.61l18.32,18Z"></path></svg>
            <span>Текст сообщения.</span>
        </div>

        <script src="scripts/auth.js"></script>
    </body>
</html>
