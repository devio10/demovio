<!DOCTYPE html>
<html>
    <head>
        <title>Войти в Demovio</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles/master.css">
        <link rel="stylesheet" href="styles/auth.css">
        <link rel="stylesheet" href="styles/master-phones.css" media="screen and (max-width: 768px)">
        <link rel="stylesheet" href="styles/auth-phones.css" media="screen and (max-width: 768px)">
        <link rel="stylesheet" href="styles/spinner.css">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <div class="page-content">
            <div class="page-backgrounds">
                <img src="posters/home-christmas.jpeg" id="bg-credentials">
            </div>
            <div class="page-main">
                <div class="screen screen-credentials">
                    <h1>Войдите в аккаунт</h1>
                    <p class="text-description">Вы получите доступ к услугам Demovio, вашему паспорту, карте целого мира и статистике сервера.</p>
                    
                    <div class="fields">
                        <span class="input-title">Имя Игрока</span>
                        <input type="text" name="name" class="input-name">
                        <span class="input-title">Пароль</span>
                        <input type="password" name="password" class="input-password">
                    </div>
                    <div class="screen-buttons">
                        <button onclick="login()" class="submit-button">
                            <span>Войти в аккаунт</span>
                            <div class="button-spinner">
                                <div class="spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
                            </div>
                        </button>
                        <a href="signup" class="submit-button no-background">Создать новый аккаунт</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="popup hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="#4ade80" viewBox="0 0 256 256"><path d="M246.15,65.46l-.07-.08L222.15,41.85a20,20,0,0,0-28.23-.05l-90,88.83L70.06,97.78a20,20,0,0,0-28.21.08l-24,24a20,20,0,0,0,0,28.26l71.62,72a20,20,0,0,0,28.29,0L246.15,93.74A20,20,0,0,0,246.15,65.46ZM103.61,202.33,37.64,136,56,117.61,95.65,156a12,12,0,0,0,16.78-.08L208,61.61l18.32,18Z"></path></svg>
            <span>Текст сообщения.</span>
        </div>

        <script src="scripts/auth.js"></script>
    </body>
</html>
